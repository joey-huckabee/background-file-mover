# ----------------------------------------
# CodeQL Security Scan
# ----------------------------------------
# Builds a CodeQL database per language and reports findings to GitHub code
# scanning (Security tab).
#
# C++ only. The Python implementation was removed from this branch ahead of
# v1.0.0; it remains on `main` and at the v0.4.2 tag, which have their own
# workflow runs.
#
# CodeQL cannot extract C/C++ without observing a compiler, so build-mode:
# manual runs a real build between init and analyze. autobuild is deliberately
# not used: the Makefile keys BUILD_DIR on the toolchain, and autobuild's
# heuristics do not know that.
# ----------------------------------------

name: CodeQL Security Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, v2-cpp ]
  push:
    branches: [ main, v2-cpp ]
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04

    permissions:
      security-events: write  # upload SARIF results to GitHub code scanning
      actions: read           # read metadata about the actions used
      contents: read          # check out the repository

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Only the C++ database needs a build. CodeQL traces the compiler
      # invocations, so this must be a genuine compile — not a no-op.
      #
      # -Werror is dropped here on purpose: CodeQL injects a wrapper around
      # the compiler, and a warning surfaced by that indirection would fail
      # extraction for a reason unrelated to code quality. The real -Werror
      # gate lives in cpp-ci.yml, on both GCC 11 and GCC 4.8.5.
      - name: Build C++ for CodeQL extraction
        if: matrix.build-mode == 'manual'
        run: make -C cpp all CXXFLAGS="-std=c++11 -Wall -Wextra -O1 -g"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
