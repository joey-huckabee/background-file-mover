name: C++ CI

# Build and test the C++ tree under cpp/. Separate from the Python CI
# (ci.yml) so the two implementations gate independently while they coexist
# during the v1.0.0 migration.
#
# Three tiers, per ADR-0001 and ADR-0008:
#   1. modern toolchain — fast feedback, plus the instrumentation GCC 4.8 cannot host
#   2. gcc 4.8.5        — fidelity for the SLES 12 SP5 system compiler
#   3. real SLES 12     — NOT here. E2E, systemd, and the NFS qualification
#                          checklist run on hardware; see docs/DEPLOYMENT.md.
#
# Tier 2 runs the FULL test suite, not just a compile. That is what closes
# the gap between the instrumented build and the shipped build — do not
# reduce it to `make all`.
#
# TOOLCHAIN POLICY
# The runner image and every analysis tool are pinned by explicit version.
# `ubuntu-latest` is never used: it is a moving pointer, and when GitHub moved
# it from 22.04 to 24.04 three jobs went red with no code change behind them.
#
# The modern toolchain is an *instrument*, not a target — it never produces a
# shipped artifact, so tracking current versions carries no SLES 12 risk. It
# is therefore deliberately newer than the image defaults (g++-14 and
# clang-tidy-20 rather than 13 and 18), because newer analyzers find more.
# Upgrade on purpose, in a commit that also handles the fallout.
#
# Reproduce any of this locally with:  cd cpp && make check-ci

on:
  push:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-ci.yml"
  pull_request:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-ci.yml"

permissions:
  contents: read

concurrency:
  group: cpp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Applied to every job. The Makefile honours CXX, so this selects the
  # compiler for the functional, sanitizer, and coverage tiers alike.
  CXX: g++-14
  # The vendored SQLite amalgamation is C, so the build needs a C compiler as
  # well. Pinned alongside CXX for the same reason: the runner's default `cc`
  # is gcc-13, a different compiler from the g++-14 that builds the C++
  # objects. Every job that compiles must install gcc-14 explicitly -- the
  # `g++-14` package alone does not provide a usable `cc`.
  CC: gcc-14

jobs:
  build-test-modern:
    name: build & test (g++-14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-14 gcc-14 clang-20 clang-tidy-20 cppcheck valgrind locales
      # The locale-independence test (L3-CPP-052) parses under tr_TR.UTF-8,
      # where std::tolower('I') does not yield 'i'. setlocale returns NULL if
      # the locale is not generated and the test downgrades to a warning, so
      # generate it and let the check actually run.
      - name: Generate the Turkish locale
        run: sudo locale-gen tr_TR.UTF-8
      # Printed so a runner-image or package change shows up as a visible diff
      # in the log rather than as an unexplained warning in some other job.
      - name: Toolchain versions
        run: make -C cpp versions
      - name: Build
        run: make -C cpp all
      - name: Test
        run: make -C cpp check

  # Fidelity job: the official gcc:4.8 image (Debian 7 "wheezy", glibc 2.13,
  # GCC 4.8.5) — the closest public proxy for the SLES 12 SP5 system compiler.
  # It is a proxy, not the target: older glibc (2.13 vs 2.22), no systemd, no
  # NFS. It proves C++11 conformance, not deployability. Being *older* than the
  # target makes it a conservative floor: passing here implies passing there.
  #
  # This does NOT use a job-level `container:`. Doing so runs every step
  # inside the image, and node-based actions (checkout, upload-artifact)
  # cannot execute against its glibc — which forces a hand-rolled `git clone`
  # inside the container. That clone no longer works: the image ships git
  # 1.7.10.4 (2012), which exits 128 with no diagnostic when cloning from
  # GitHub today, and `git fetch origin <sha>` predates its capabilities
  # regardless.
  #
  # Instead the runner checks out normally with modern tooling and the old
  # compiler is invoked via `docker run` over the mounted workspace. The
  # container then only has to compile, which is all it is good for.
  #
  # CXX is unset here deliberately: inside the container the only compiler is
  # GCC 4.8.5's `g++`, and the workflow-level g++-14 must not leak in.
  build-test-gcc48:
    name: build & test (gcc 4.8.5)
    runs-on: ubuntu-24.04
    env:
      CXX: ""
      CC: ""
    steps:
      - uses: actions/checkout@v6
      # A mirror of docker.io/library/gcc:4.8, byte-identical, republished with
      # a v2s2 manifest. Keep this in step with GCC48_IMAGE in cpp/Makefile.
      #
      # The upstream tag cannot be used here any more. It was pushed in 2016
      # with a Docker manifest v2 *schema 1*, which modern Docker refuses by
      # default, so this job died at the pull:
      #
      #   docker: [DEPRECATION NOTICE] ... schema 1 support is disabled by
      #   default and will be removed in an upcoming release
      #   Process completed with exit code 125
      #
      # It failed before compiling anything, while the same tier passed locally
      # because podman still accepts schema 1 -- a local/CI divergence that hid
      # the breakage. Schema 1 is being removed outright, so re-pointing at the
      # upstream tag would not have survived either.
      - name: Toolchain versions
        run: docker run --rm ghcr.io/joey-huckabee/gcc-4.8:4.8.5 sh -c "g++ --version | head -1; make --version | head -1"
      - name: Build and test
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src ghcr.io/joey-huckabee/gcc-4.8:4.8.5 \
            sh -c "make -C cpp clean && make -C cpp check"

  # ASan (heap/stack overflow, use-after-free), UBSan (undefined behavior),
  # LSan (leaks) — all fatal on first finding. Modern toolchain only: GCC
  # 4.8 has partial ASan and no LSan.
  sanitizers:
    name: ASan + UBSan + LSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-14 gcc-14
      - name: Build & test (instrumented)
        run: make -C cpp check SANITIZE=1

  # ThreadSanitizer (L2-ARC-008). A separate job, not an extra flag on the
  # sanitizer build: TSan and ASan cannot coexist in one binary because their
  # shadow-memory layouts conflict.
  #
  # In place before the first thread exists, deliberately. A race introduced
  # alongside the code that first needs threads is far cheaper to find than one
  # discovered later, and a race can sit in a tree for years while every test
  # passes — it surfaces only under a scheduler the test machine never
  # produces.
  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-14 gcc-14
      - name: Build & test (TSan)
        run: make -C cpp check THREAD=1

  # Valgrind memcheck structures detection differently from the sanitizers;
  # --error-exitcode=1 fails on any finding, including still-reachable blocks.
  valgrind:
    name: Valgrind memcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-14 gcc-14 valgrind
      - name: Build
        run: make -C cpp all
      - name: Memcheck
        run: make -C cpp check-valgrind

  # Vendored files must byte-match the hashes in VENDORED.md (ADR-0004).
  #
  # This gate exists because a repository-wide text substitution once rewrote
  # an identifier *inside* the vendored Catch2 header. The build passed —
  # declaration and definition were renamed consistently — and so did every
  # other gate. A compiler cannot tell that a dependency was edited; only a
  # checksum can.
  vendored-integrity:
    name: Vendored file integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify hashes
        run: make -C cpp verify-vendored

  # Requirement traceability. This gate previously lived in the Python ci.yml;
  # it moved here when that workflow was removed with the Python tree, because
  # the matrix covers the requirements rather than either implementation and
  # losing it would let L1/L2/L3 drift from the tests silently.
  #
  # The generator reads pytest markers AND Catch2 tags, so it is the C++ tests
  # that keep it honest on this branch. Standard library only — no install step.
  trace-matrix:
    name: Requirements trace matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check for drift
        run: python3 scripts/build-trace-matrix.py --check

  # L3-CPP-052: the untrusted-input parsers must classify characters with
  # explicit ranges, never <cctype> or the strtoul family.
  #
  # This is a source gate rather than only a unit test on purpose. The runtime
  # test switches to tr_TR.UTF-8 and re-parses — the real proof, since
  # std::tolower('I') under Turkish does not yield 'i' — but setlocale returns
  # NULL where that locale is not generated, and it is not generated on the
  # runner. The test therefore degrades to a warning exactly where it would
  # otherwise run. Grep cannot be skipped by the environment.
  locale-free:
    name: Locale-free parsers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify
        run: make -C cpp locale-free

  # Static analysis over project sources. Vendored headers are excluded:
  # they are pinned upstream artifacts, not project code (ADR-0004).
  static-analysis:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q cppcheck
      - name: Analyze
        run: >
          cppcheck --enable=warning,portability --error-exitcode=1
          --inline-suppr --std=c++11 -Icpp/include cpp/src/ cpp/tests/

  # clang-tidy over project sources. Complements cppcheck rather than
  # replacing it — the two disagree often enough to justify both; clang-tidy
  # found dead code and two unchecked snprintf calls that cppcheck and
  # -Werror both passed over. Needs a compilation database, which bear
  # records from a real build. Disabled checks live in cpp/.clang-tidy.
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-14 gcc-14 clang-tidy-20 bear
      # bear records only the compiler invocations it observes, so the tree
      # must be clean first. A pre-built tree yields an empty database, and
      # clang-tidy then skips every file and exits 0 — a gate that passes
      # having analyzed nothing.
      - name: Generate compilation database
        run: |
          make -C cpp clean-all
          bear --output cpp/compile_commands.json -- make -C cpp all
      - name: Assert the database covers the sources
        run: |
          cd cpp
          sh scripts/assert-compile-db.sh compile_commands.json src/job.cpp src/json.cpp
      # Runs `make tidy` rather than naming files here. A hardcoded list in
      # this workflow silently stopped covering api_codec.cpp and config.cpp
      # when they landed — the job stayed green while checking less and less.
      # `make tidy` analyses $(LIB_SRC), so it cannot drift from the build.
      - name: Analyze
        run: make -C cpp tidy TIDY=clang-tidy-20

  # Fuzzing regression gate (ADR-0008). Replays every committed seed and every
  # retained crash reproducer. Seconds to run, so it belongs on every PR —
  # this is the part that makes a past finding stay fixed.
  fuzz-regression:
    name: Fuzz corpus replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install clang
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-20
      - name: Replay committed corpus
        run: make -C cpp fuzz-corpus FUZZ_CXX=clang++-20

  # A short live session on every PR. Finds nothing most of the time; the
  # nightly burn-in (cpp-fuzz.yml) is where depth comes from. A crash fails
  # the build and the reproducer is uploaded for minimization.
  fuzz-short:
    name: Fuzz (60s)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install clang
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-20
      - name: Fuzz
        run: make -C cpp fuzz-run FUZZ_SECONDS=60 FUZZ_CXX=clang++-20
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-short
          path: cpp/build/fuzz/artifacts-*/
          if-no-files-found: ignore

  # Coverage runs here so the number is visible per-PR even when the
  # SonarCloud secrets are absent. SonarCloud consumes the same gcov output.
  coverage:
    name: Coverage (gcov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-14 gcc-14
      # gcov must match the compiler that produced the notes files, or it
      # reports "version mismatch" and emits nothing usable.
      - name: Build instrumented and run
        run: make -C cpp coverage GCOV=gcov-14
      - name: Summarize
        run: |
          {
            echo "### C++ coverage"
            echo
            sh cpp/scripts/coverage-summary.sh \
               cpp/build/coverage/report markdown
          } >> "$GITHUB_STEP_SUMMARY"

  # NOTE: `make format-check` is deliberately NOT a gate. The existing sources
  # use column alignment that clang-format rewrites, so enabling it would
  # require a one-time bulk reformat of already-tested code — a decision to
  # take on purpose, not one to acquire by adding a job.
