name: Repository hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  line-endings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Reject CR line endings in committed text files
        # .gitattributes normalizes text to LF on commit; this catches anything
        # committed without that normalization. Binary files report i/-text.
        run: |
          bad=$(git ls-files --eol | awk '$1=="i/crlf" || $1=="i/mixed" {print $NF}')
          if [ -n "$bad" ]; then echo "CR line endings in:"; echo "$bad"; exit 1; fi

  admin-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Lossless JSON parser in the embedded admin page
        run: node scripts/admin-ui/lossless-json.test.js
      - name: Job history loading bound and Load older jobs
        run: node scripts/admin-ui/history-loading.test.js
      - name: File-name search (debounce, cursors, generations)
        run: node scripts/admin-ui/file-search.test.js
      - name: Dashboard has no HTML sinks or inline handlers
        run: node scripts/admin-ui/no-html-sinks.test.js
      - name: L2 traceability references
        run: python3 scripts/check_trace.py
      - name: L1 roll-up matches L2 parents and evidence
        run: python3 scripts/trace_l1.py
      - name: Embedded retry-context vectors match the contract copy
        run: cmp docs/api/retry-context.candidate.vectors.json rust/crates/file-mover/src/retry_context.vectors.json
