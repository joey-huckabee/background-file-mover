name: C++ fuzz burn-in

# Deep libFuzzer burn-in for the untrusted-input path (ADR-0008). The PR gate
# in cpp-ci.yml runs 60 seconds to keep pull requests fast; this scheduled job
# runs long enough to reach code a short session never will.
#
# The fast-gate / deep-burn-in split was inherited from the Python harness
# (.github/workflows/fuzz.yml, removed from this branch with that
# implementation) and kept because the shape is right: pull requests stay
# fast, and depth comes from the schedule instead.
#
# When this job finds a crash, the reproducer is uploaded as an artifact. The
# workflow deliberately does NOT commit it: minimizing the input and adding it
# to the matching cpp/fuzz/corpus-regression-<target>/ is a human step, because the minimized case
# should be readable and named for what it exercises.

on:
  schedule:
    # Daily at 06:30 UTC — half an hour after the Python burn-in, so the two
    # do not contend for runners.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzzing duration in seconds"
        default: "1800"

permissions:
  contents: read

concurrency:
  group: cpp-fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# See cpp-ci.yml: a `container:` job defaults to `sh` rather than `bash`, so
# this restores the shell the steps were written against.
defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: libFuzzer burn-in
    runs-on: ubuntu-24.04
    # The same toolchain image as cpp-ci.yml, so the nightly burn-in fuzzes
    # binaries built by the same clang that the per-PR replay gate uses. This
    # job used to apt-install its own clang-20, which pinned the same version
    # but by a separate mechanism -- two pins that can drift apart is the
    # arrangement that let the fidelity tier break unnoticed.
    container:
      image: ghcr.io/joey-huckabee/bfm-ci:2026-08-04
      # libFuzzer links ASan and UBSan, and LeakSanitizer needs ptrace, which
      # containers block by default.
      options: --cap-add=SYS_PTRACE
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Toolchain versions
        run: clang++-20 --version | head -1

      # ASan + UBSan are linked in alongside the fuzzer, so a memory-safety
      # fault is caught at the moment it happens rather than surfacing as a
      # later crash with a useless stack.
      - name: Fuzz
        run: |
          make -C cpp fuzz-run \
            FUZZ_CXX=clang++-20 \
            FUZZ_SECONDS=${{ github.event.inputs.seconds || '1800' }}

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-fuzz-artifacts
          path: cpp/build/fuzz/artifacts-*/
          if-no-files-found: ignore

      # The corpus libFuzzer accumulated during the run. Useful for seeding a
      # follow-up investigation; not committed, since most of it is noise and
      # the committed seeds are curated by hand.
      - name: Upload working corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-fuzz-corpus
          path: cpp/build/fuzz/corpus-*/
          retention-days: 7
          if-no-files-found: ignore
