# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party (SonarSource) and governed by separate terms of service.
#
# Setup (one-time, per the SonarCloud onboarding tutorial):
#   1. On SonarCloud, add your GitHub org and import this repo as a project.
#   2. Administration > Analysis Method: turn OFF "Automatic Analysis".
#   3. Add repo secrets: SONAR_TOKEN, SONAR_PROJECT_KEY, SONAR_ORGANIZATION.
# Until those secrets exist, every analysis step is skipped (safe no-op).
#
# Both implementations are analyzed in ONE scanner invocation. A SonarCloud
# project holds a single analysis per branch, so a second workflow scanning
# C++ separately would overwrite the Python results rather than add to them.
#
# C/C++ analysis needs the scanner to see how each file was compiled. Rather
# than the legacy build-wrapper, this uses sonar.cfamily.compile-commands with
# the compilation database that `bear` records from a real build — the same
# database clangd uses locally (see CONTRIBUTING.md).
#
# Note: SonarCloud's CFamily analyzer is free for public repositories; private
# repositories need a paid plan. If C++ issues never appear while Python ones
# do, check the plan before debugging the workflow.
name: Analyze with SonarCloud

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, v2-cpp ]
  push:
    branches: [ main, v2-cpp ]
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC

permissions:
  contents: read
  pull-requests: read     # allows SonarCloud to decorate PRs
  security-events: write  # needed to upload SARIF results to GitHub

jobs:
  sonarcloud:
    runs-on: ubuntu-24.04

    env:
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check Sonar secrets (safe)
        run: |
          test -n "$SONAR_ORGANIZATION" && echo "SONAR_ORGANIZATION is set" || echo "SONAR_ORGANIZATION is NOT set"
          test -n "$SONAR_PROJECT_KEY" && echo "SONAR_PROJECT_KEY is set" || echo "SONAR_PROJECT_KEY is NOT set"
          test -n "$SONAR_TOKEN" && echo "SONAR_TOKEN is set" || echo "SONAR_TOKEN is NOT set"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for accurate Sonar analysis

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Python coverage (XML)
        run: poetry run pytest --cov --cov-report=xml   # -> coverage.xml

      # --- C++ -----------------------------------------------------------
      # bear records the compilation database the CFamily analyzer needs.
      - name: Install bear
        run: sudo apt-get update -q && sudo apt-get install -y -q bear

      - name: C++ compilation database
        run: |
          make -C cpp clean-all
          bear --output cpp/compile_commands.json -- make -C cpp all

      # Coverage is a separate -O0 --coverage build in its own tier, so the
      # instrumented objects never mix with the ones bear just recorded.
      - name: C++ coverage (gcov)
        run: make -C cpp coverage

      - name: Install SonarScanner
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '' }}
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q sonar-scanner.zip
          SCANNER_DIR=$(find . -maxdepth 1 -type d -name "sonar-scanner-*")
          echo "$RUNNER_TEMP/$SCANNER_DIR/bin" >> "$GITHUB_PATH"

      - name: Analyze with SonarCloud (runner)
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '' }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_QG_WAIT: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        run: |
          args=(
            "-Dsonar.projectKey=${SONAR_PROJECT_KEY}"
            "-Dsonar.organization=${SONAR_ORGANIZATION}"
            "-Dsonar.sources=src,cpp/src,cpp/include"
            "-Dsonar.tests=tests,cpp/tests"
            "-Dsonar.exclusions=dist/**,**/__pycache__/**,docs/**,.github/**,sonar-scanner*.zip,sonar-scanner-*/**,cpp/third_party/**,cpp/build/**,cpp/fuzz/corpus/**,transcripts/**"
            "-Dsonar.python.version=3.10"
            "-Dsonar.python.coverage.reportPaths=coverage.xml"
            "-Dsonar.cfamily.compile-commands=cpp/compile_commands.json"
            "-Dsonar.cfamily.gcov.reportsPath=cpp/build/coverage/report"
          )
          if [ "$SONAR_QG_WAIT" = "true" ]; then
            echo "Default branch push (${GITHUB_REF_NAME}) - waiting for Quality Gate..."
            args+=("-Dsonar.qualitygate.wait=true" "-Dsonar.qualitygate.timeout=600")
          fi
          sonar-scanner "${args[@]}"

      - name: SonarCloud skipped (missing secrets)
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_PROJECT_KEY == '' || env.SONAR_ORGANIZATION == '' }}
        run: echo "Skipping SonarCloud (missing SONAR_TOKEN / SONAR_PROJECT_KEY / SONAR_ORGANIZATION)."
