# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party (SonarSource) and governed by separate terms of service.
#
# Setup (one-time, per the SonarCloud onboarding tutorial):
#   1. On SonarCloud, add your GitHub org and import this repo as a project.
#   2. Administration > Analysis Method: turn OFF "Automatic Analysis".
#   3. Add repo secrets: SONAR_TOKEN, SONAR_PROJECT_KEY, SONAR_ORGANIZATION.
# Until those secrets exist, every analysis step is skipped (safe no-op).
#
# C++ only. The Python implementation was removed from this branch ahead of
# v1.0.0; it remains on `main` and at the v0.4.2 tag.
#
# Keep this as ONE scanner invocation. A SonarCloud project holds a single
# analysis per branch, so a second workflow scanning another language would
# overwrite these results rather than add to them — worth remembering if a
# second language ever returns.
#
# C/C++ analysis needs the scanner to see how each file was compiled. Rather
# than the legacy build-wrapper, this uses sonar.cfamily.compile-commands with
# the compilation database that `bear` records from a real build — the same
# database clangd uses locally (see CONTRIBUTING.md).
#
# Note: SonarCloud's CFamily analyzer is free for public repositories; private
# repositories need a paid plan. If C++ issues never appear at all, check the
# plan before debugging the workflow.
name: Analyze with SonarCloud

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, 'c*-*' ]
  push:
    branches: [ main, 'c*-*' ]
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC

permissions:
  contents: read
  pull-requests: read     # allows SonarCloud to decorate PRs
  security-events: write  # needed to upload SARIF results to GitHub

jobs:
  sonarcloud:
    runs-on: ubuntu-24.04

    # The same toolchain image cpp-ci.yml uses. Until this changed, SonarCloud
    # was the one workflow still apt-installing its own tools, and it installed
    # only `bear` -- so it built the compilation database with the runner's
    # default g++-13 while every gate in cpp-ci.yml verifies g++-14. The
    # analysis therefore described a compilation that CI never checked.
    container:
      image: ghcr.io/joey-huckabee/bfm-ci:2026-08-04

    env:
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Pinned to match cpp-ci.yml. gcov must match the compiler that produced
      # the notes files or it reports a version mismatch and emits nothing.
      CXX: g++-14
      CC: gcc-14

    steps:
      - name: Check Sonar secrets (safe)
        run: |
          test -n "$SONAR_ORGANIZATION" && echo "SONAR_ORGANIZATION is set" || echo "SONAR_ORGANIZATION is NOT set"
          test -n "$SONAR_PROJECT_KEY" && echo "SONAR_PROJECT_KEY is set" || echo "SONAR_PROJECT_KEY is NOT set"
          test -n "$SONAR_TOKEN" && echo "SONAR_TOKEN is set" || echo "SONAR_TOKEN is NOT set"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for accurate Sonar analysis

      # bear records the compilation database the CFamily analyzer needs, and
      # ships in the toolchain image alongside the compiler it records.
      - name: C++ compilation database
        run: |
          make -C cpp clean-all
          bear --output cpp/compile_commands.json -- make -C cpp -j$(nproc) all

      # Coverage is a separate -O0 --coverage build in its own tier, so the
      # instrumented objects never mix with the ones bear just recorded.
      - name: C++ coverage (gcov)
        run: make -C cpp -j$(nproc) coverage GCOV=gcov-14

      - name: Install SonarScanner
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '' }}
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q sonar-scanner.zip
          SCANNER_DIR=$(find . -maxdepth 1 -type d -name "sonar-scanner-*")
          echo "$RUNNER_TEMP/$SCANNER_DIR/bin" >> "$GITHUB_PATH"

      - name: Analyze with SonarCloud (runner)
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '' }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_QG_WAIT: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        run: |
          # Run from cpp/, so the scanner's working directory and its project
          # base directory are the same place and every relative path below
          # means one thing.
          #
          # Why this matters, and it is not tidiness. gcov records the path a
          # file was compiled with, and the objects are built from cpp/, so a
          # report reads "Source:src/config.cpp". Scanning from the repository
          # root made SonarCloud resolve that against the root --
          # <root>/src/config.cpp, which does not exist and is not in
          # sonar.sources -- so it logged
          #
          #   WARN File not analysed by Sonar, so ignoring coverage: .../src/config.cpp
          #
          # once per file, discarded the entire report, and let the Zero
          # Coverage Sensor record 0%. The analysis still succeeded, so it
          # stayed invisible until a default-branch push waited on the Quality
          # Gate and failed it.
          #
          # The first attempt at this fix set -Dsonar.projectBaseDir=cpp and
          # left the scanner running from the root. That is not equivalent:
          # sonar.cfamily.compile-commands is resolved against the *working
          # directory*, not against projectBaseDir, so the analysis died with
          #
          #   NoSuchFileException: <root>/compile_commands.json
          #
          # Two different base directories for two properties is a trap; cd
          # removes it by making them the same directory.
          cd cpp
          args=(
            "-Dsonar.projectKey=${SONAR_PROJECT_KEY}"
            "-Dsonar.organization=${SONAR_ORGANIZATION}"
            "-Dsonar.sources=src,include"
            "-Dsonar.tests=tests"
            "-Dsonar.exclusions=third_party/**,build/**,fuzz/corpus-*/**"
            "-Dsonar.cfamily.compile-commands=compile_commands.json"
            "-Dsonar.cfamily.gcov.reportsPath=build/coverage/report"
          )
          if [ "$SONAR_QG_WAIT" = "true" ]; then
            echo "Default branch push (${GITHUB_REF_NAME}) - waiting for Quality Gate..."
            args+=("-Dsonar.qualitygate.wait=true" "-Dsonar.qualitygate.timeout=600")
          fi
          sonar-scanner "${args[@]}"

      - name: SonarCloud skipped (missing secrets)
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_PROJECT_KEY == '' || env.SONAR_ORGANIZATION == '' }}
        run: echo "Skipping SonarCloud (missing SONAR_TOKEN / SONAR_PROJECT_KEY / SONAR_ORGANIZATION)."
