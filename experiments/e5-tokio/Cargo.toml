[workspace]
members = ["control", "probe", "json", "http", "cumulative"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "signal", "sync", "time", "net", "io-util"] }
httparse = { version = "=1.10.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
strip = "none"
panic = "unwind"
