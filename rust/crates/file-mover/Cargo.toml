[package]
name = "file-mover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
nfs-qualification = ["mover-fs/nfs-qualification"]

[dependencies]
mover-core = { path = "../mover-core" }
mover-store = { path = "../mover-store" }
mover-fs = { path = "../mover-fs" }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "signal", "sync", "time", "net", "io-util"] }
httparse = { version = "=1.10.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["tls12", "aws_lc_rs"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["std", "zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
subtle = { version = "=2.6.1", default-features = false }

[lints]
workspace = true
