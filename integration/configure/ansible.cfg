[defaults]
inventory = inventory.ini
host_key_checking = False
# Human-readable output. The default callback prints one line per task with the
# result buried in JSON; this one is legible when something fails at 2am.
stdout_callback = yaml
# Facts are gathered because base/tasks/main.yml asserts on distribution,
# distribution_major_version and the SELinux mode. Turning gathering off to
# save a few seconds would silently disable those assertions.
gathering = smart
interpreter_python = /usr/bin/python3
retry_files_enabled = False

[ssh_connection]
pipelining = True
