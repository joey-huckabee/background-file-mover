# Background File Mover -- reference configuration.
#
# Deployed at /etc/file-mover/file-mover.ini and validated before the service
# starts (L2-CTL-019):
#
#     file-mover --config /etc/file-mover/file-mover.ini --check
#
# Every key below is one the C++ parser accepts TODAY, with its built-in
# default shown. An unknown key or section is an error, not a warning
# (L3-CPP-036) -- a typo in a setting that silently does nothing is worse than
# a service that refuses to start and says why. So this file is not a wish
# list: keys for subsystems that have not landed yet are documented in
# docs/CONFIG-REFERENCE.md and would fail --check if written here.
#
# Only storage.database_path is required. Everything else may be omitted.

[http]
# The control plane. Bound to loopback by default and deliberately: the API
# has no authentication of its own, so exposing it is a decision an operator
# makes explicitly rather than one they inherit from a default.
bind = 127.0.0.1

port = 8080

# Largest request body accepted, in bytes (1..16777216). Bounds the memory a
# single unauthenticated connection can cause to be allocated.
max_body_bytes = 65536

[jobs]
# Worker threads executing moves (1..64). Transfers are I/O-bound, so raising
# this past the storage's useful concurrency adds contention, not throughput.
workers = 4

[storage]
# REQUIRED. The durable state database.
#
# Must sit on LOCAL storage, not on the NFS mount holding the recordings
# (L2-JOB-008): SQLite's locking is advisory over NFS, and the failure is
# silent corruption rather than an error. --check verifies the filesystem and
# refuses to start if it is remote.
#
# Matches StateDirectory= in the systemd unit.
database_path = /var/lib/file-mover/file-mover.db

[retry]
# L2-RTY-005. Bounded (1..100): unbounded retry against a permanent failure is
# how a queue fills with work that can never succeed.
max_attempts = 3

# Exponential backoff bounds, in milliseconds (1..3600000 each).
# backoff_initial_ms must not exceed backoff_max_ms.
backoff_initial_ms = 1000
backoff_max_ms = 60000

[logging]
# Minimum severity written to the standard streams: DEBUG, INFO, WARNING,
# ERROR, or OFF.
#
# The service manages no log files (L2-CLI-006, twelve-factor XI). It writes
# DEBUG and INFO to stdout and WARNING and above to stderr, and the environment
# routes them -- journald under the shipped systemd unit:
#
#     journalctl -u file-mover            # everything
#     journalctl -u file-mover -p warning # stderr only
#
# OFF silences the stream entirely. There is nothing to rotate and no log file
# to run out of disk.
level = INFO
